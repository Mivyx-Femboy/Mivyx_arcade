<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="1200" height="280" role="img" aria-label="Mivyx Gaming Hub">
<defs>
 <radialGradient id="g1" cx="12%" cy="0%" r="70%"><stop offset="0" stop-color="#9aa5ff" stop-opacity=".30"/><stop offset="1" stop-color="#9aa5ff" stop-opacity="0"/></radialGradient>
 <radialGradient id="g2" cx="95%" cy="100%" r="65%"><stop offset="0" stop-color="#8957e5" stop-opacity=".32"/><stop offset="1" stop-color="#8957e5" stop-opacity="0"/></radialGradient>
 <linearGradient id="ln" x1="0" x2="1"><stop offset="0" stop-color="#9aa5ff" stop-opacity="0"/><stop offset=".5" stop-color="#9aa5ff"/><stop offset="1" stop-color="#8957e5" stop-opacity="0"/></linearGradient>
 <style>
  .cur{animation:b 1.1s steps(1) infinite} @keyframes b{50%{opacity:0}}
  .scan{animation:s 5s ease-in-out infinite} @keyframes s{0%{transform:translateX(-300px);opacity:0}20%,80%{opacity:1}100%{transform:translateX(900px);opacity:0}}
  .px{animation:f 6s ease-in-out infinite} @keyframes f{50%{transform:translateY(-10px)}}
  @media (prefers-reduced-motion:reduce){.cur,.scan,.px{animation:none}}
 </style>
</defs>
<rect width="1200" height="280" rx="14" fill="#0d1117"/>
<rect width="1200" height="280" rx="14" fill="url(#g1)"/><rect width="1200" height="280" rx="14" fill="url(#g2)"/>
